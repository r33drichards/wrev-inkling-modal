name: Vendor exact upstream source trees
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vendor-pinned-sources
  cancel-in-progress: false
jobs:
  vendor:
    if: github.ref == 'refs/heads/main' && github.repository == 'r33drichards/wrev-inkling-modal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Import pinned Git trees without running upstream code
        shell: bash
        run: |
          set -euo pipefail
          import_tree() {
            local name="$1" commit="$2" expected="$3"
            git fetch --no-tags --depth=1 "https://github.com/r33drichards/${name}.git" "$commit"
            test "$(git rev-parse FETCH_HEAD)" = "$commit"
            test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$expected"
            local current
            current="$(git rev-parse --verify "HEAD:$name" 2>/dev/null || true)"
            if test -n "$current"; then
              test "$current" = "$expected"
            else
              git read-tree --prefix="$name/" "$expected"
            fi
          }
          import_tree wrev d8713736595c2067796c72d00b91db63db28fab4 620a2b4922ba6914e78a5fc2b05aad828e818c27
          import_tree webhook af3d2a160d817018e7477544e7bd098d3ce04843 a666efa1de741dee5031f93d7b0ecd040025e8ae
          index_tree="$(git write-tree)"
          test "$(git rev-parse "$index_tree:wrev")" = 620a2b4922ba6914e78a5fc2b05aad828e818c27
          test "$(git rev-parse "$index_tree:webhook")" = a666efa1de741dee5031f93d7b0ecd040025e8ae
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Vendor pinned Wrev and webhook source trees'
          git push origin HEAD:main
